<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Sabrina Residences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500&family=Manrope:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        /* Base & Reset */
        body {
            margin: 0;
            background: #fff;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-family: 'Archivo', sans-serif;
            color: #fff;
            overflow-x: hidden;
        }
        *, *::before, *::after { box-sizing: inherit; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }

        /* Page Background */
        .page-wrapper {
            position: relative;
            background: linear-gradient(180deg, #1150ef 0%, #135af3 30%, #3c7af6 52%, #76a2fa 64%, #86acfb 70%, #b9cffd 84%, #ffffff 100%);
            min-height: 100vh;
        }
        .glow-overlay {
            position: absolute; inset: 0; pointer-events: none; z-index: 0;
            background:
                radial-gradient(40% 18% at 30% 12%, rgba(120,170,255,.35) 0%, transparent 70%),
                radial-gradient(35% 14% at 78% 26%, rgba(130,175,255,.28) 0%, transparent 70%),
                radial-gradient(30% 10% at 55% 3%, rgba(110,160,255,.3) 0%, transparent 70%);
        }
        .grid-lines {
            position: absolute; inset: 0; pointer-events: none; z-index: 0; overflow: hidden;
        }
        .grid-line {
            position: absolute; top: 0; bottom: 0; width: 1px; background: rgba(255,255,255,.28);
            transform-origin: top; transform: scaleY(0);
            animation: lineGrow 1.6s cubic-bezier(.65,0,.35,1) forwards;
        }
        @keyframes lineGrow { to { transform: scaleY(1); } }

        /* Word Animation Setup */
        .word {
            display: inline-block;
            opacity: 0;
            transform: translateY(0.45em);
            filter: blur(10px);
            animation: wordIn var(--duration, 0.7s) cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
            animation-delay: var(--delay, 0s);
        }
        @keyframes wordIn {
            to { opacity: 1; transform: translateY(0); filter: blur(0px); }
        }

        /* Hero Section */
        .hero {
            position: relative; overflow: hidden;
            min-height: clamp(760px, 75vw, 1300px);
            display: flex; flex-direction: column; z-index: 1;
        }
        .hero-img {
            position: absolute; right: 4.8vw; bottom: 0;
            width: max(83vw, 640px); height: auto; z-index: 1;
            opacity: 0; transform: translateY(70%) scale(1.06);
            animation: heroImgLoad 4.2s cubic-bezier(.22,.61,.24,1) 0.2s forwards;
            pointer-events: none;
        }
        @keyframes heroImgLoad {
            0% { opacity: 0; transform: translateY(70%) scale(1.06); }
            25% { opacity: 1; }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header / Nav */
        .header {
            display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px;
            padding: 24px clamp(16px, 2.2vw, 40px) 0; z-index: 10; position: relative; align-items: center;
        }
        .nav-item {
            opacity: 0; transform: translateY(-14px);
            animation: navDrop 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
            animation-delay: var(--delay, 0s);
        }
        @keyframes navDrop { to { opacity: 1; transform: translateY(0); } }
        
        .logo { justify-self: start; }
        .nav-desktop { justify-self: center; display: flex; gap: 1px; }
        .nav-right { grid-column: 3; justify-self: end; display: flex; gap: 10px; align-items: center; }

        .pill {
            height: 40px; padding: 0 18px; border-radius: 999px;
            font-size: 13px; letter-spacing: -0.035em;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255,255,255,0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background 0.3s; color: #fff; font-weight: 500;
        }
        .pill:hover:not(.active) { background: rgba(255,255,255,0.3); }
        .pill.active { background: #fff; color: #161616; gap: 10px; }

        .lang-switch {
            height: 40px; border-radius: 999px;
            background: rgba(255,255,255,0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; padding: 2px; gap: 2px;
        }
        .lang-btn {
            height: 36px; width: 36px; border-radius: 999px; border: none; background: transparent;
            color: #fff; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; padding: 0;
        }
        .lang-btn.active { background: #fff; color: #161616; }

        .sign-in {
            height: 41px; padding: 0 19px; border-radius: 999px;
            border: 1px solid rgba(255,255,255,0.9); background: transparent;
            font-size: 13px; font-weight: 500; letter-spacing: -0.035em;
            display: flex; align-items: center; transition: all 0.3s;
        }
        .sign-in:hover { background: #fff; color: #1150ef; }

        .hamburger {
            height: 44px; width: 44px; border-radius: 999px;
            background: rgba(255,255,255,0.16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: none; color: #fff; display: none; align-items: center; justify-content: center; cursor: pointer;
        }
        .mobile-dropdown {
            position: absolute; top: 78px; right: clamp(16px, 2.2vw, 40px);
            border-radius: 24px; padding: 10px; gap: 6px;
            background: rgba(255,255,255,0.18); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255,255,255,0.3); display: flex; flex-direction: column;
            z-index: 20; opacity: 0; pointer-events: none; transform: translateY(-10px);
            transition: all 0.4s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .mobile-dropdown.open { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .mobile-dropdown .pill { height: 48px; justify-content: flex-start; }

        /* Headline & Tagline */
        .headline-row {
            display: flex; flex-wrap: wrap; column-gap: 24px;
            padding: clamp(28px, 3.4vw, 60px) clamp(16px, 2.2vw, 40px) 0;
            z-index: 3; position: relative; width: 100%;
        }
        .h1-title {
            font-family: 'Playfair Display', serif; font-weight: 400; text-transform: uppercase;
            font-size: clamp(40px, calc(39px + 4.9vw), 170px);
            line-height: 0.87; letter-spacing: -0.005em; margin: 0;
        }
        .h1-line { display: block; }
        .h1-line-1 { padding-left: 0.92em; }

        .tagline {
            margin-left: auto; margin-top: clamp(24px, 4.3vw, 80px);
            font-size: clamp(13px, 1.66vw, 26px); line-height: 1.02; letter-spacing: -0.045em;
            max-width: 100%;
        }
        .tagline-line { display: block; }
        .tagline-line-1 { padding-left: 3.6em; }

        /* Explore Link */
        .explore-wrapper {
            padding: clamp(36px, 5.6vw, 100px) clamp(16px, 2.2vw, 40px) 0;
            position: relative; z-index: 3; width: fit-content;
        }
        .explore-link {
            display: inline-flex; align-items: center; gap: clamp(18px, 2.4vw, 34px);
            font-size: clamp(13px, 1.3vw, 20px); letter-spacing: -0.01em;
            cursor: pointer; transition: opacity 0.3s;
        }
        .explore-link:hover { opacity: 0.8; }

        /* Video Card */
        .video-card {
            position: absolute; left: clamp(16px, 2.2vw, 40px); bottom: clamp(36px, 8.6vw, 140px);
            width: clamp(150px, 17vw, 290px); z-index: 3;
            opacity: 0; transform: translateY(30px) scale(0.97);
            animation: cardIn 1s cubic-bezier(0.2, 0.7, 0.2, 1) 2s forwards;
        }
        @keyframes cardIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .video-box {
            aspect-ratio: 1.7; border-radius: clamp(8px, 0.9vw, 14px); overflow: hidden;
            background: rgba(255,255,255,0.2);
        }
        .video-box video { width: 100%; height: 100%; object-fit: cover; }
        
        .video-caption {
            margin-top: 8px; font-family: 'Manrope', sans-serif;
            font-size: clamp(13px, 1.4vw, 22px); line-height: 1.02; letter-spacing: 0.035em;
        }
        
        .progress-container { margin-top: 12px; display: flex; gap: 5px; }
        .progress-area {
            height: 14px; flex: 1; display: flex; align-items: center; cursor: pointer;
            transition: flex 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
            transform-origin: left; transform: scaleX(0);
            animation: barGrow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) 2.55s forwards;
        }
        .progress-area.active { flex: 1.7; }
        .progress-bar {
            width: 100%; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.4);
            transition: background 0.6s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .progress-area.active .progress-bar { background: #fff; }
        @keyframes barGrow { to { transform: scaleX(1); } }

        /* Section 2: Latest Houses */
        .section-2 {
            display: flex; flex-wrap: wrap; row-gap: 32px;
            padding: clamp(56px, 9.9vw, 170px) clamp(16px, 4vw, 70px) clamp(40px, 4.4vw, 80px) clamp(16px, 2.8vw, 48px);
            position: relative; z-index: 2;
        }
        .s2-heading-col { flex: 1 1 max(200px, 24.5vw); margin-top: clamp(0px, 0.9vw, 16px); }
        .s2-heading {
            font-family: 'Playfair Display', serif; font-weight: 400; text-transform: uppercase;
            font-size: clamp(40px, 4.6vw, 80px); line-height: 1.2; color: #0d0d0d; margin: 0;
        }
        /* Houses is capitalized but not fully uppercase according to prompt: "OUR" / "LATEST" / "Houses", so we override the last word */
        .s2-word-wrap { display: block; overflow: hidden; padding-bottom: 5px; }
        .s2-word {
            display: inline-block; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 0.06em;
            opacity: 0; transform: translateY(0.45em); filter: blur(10px);
        }
        .s2-word-lowercase { text-transform: none; }
        .section-2.is-visible .s2-word { animation: wordIn 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) forwards; animation-delay: var(--delay); }
        
        .s2-gallery {
            flex: 999 1 540px; display: grid; grid-template-columns: repeat(3, minmax(170px, 1fr)); gap: clamp(10px, 1.25vw, 20px);
        }
        .s2-card {
            aspect-ratio: 0.79; border-radius: clamp(6px, 0.8vw, 12px); overflow: hidden;
            opacity: 0; transform: translateY(30px) scale(0.97);
            transition: opacity 1.1s cubic-bezier(0.2, 0.7, 0.2, 1), transform 1.1s cubic-bezier(0.2, 0.7, 0.2, 1);
        }
        .s2-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s cubic-bezier(0.2, 0.7, 0.2, 1); }
        .s2-card:hover img { transform: scale(1.05); }
        
        .section-2.is-visible .s2-card-1 { transition-delay: 0.2s; opacity: 1; transform: translateY(0) scale(1); }
        .section-2.is-visible .s2-card-2 { transition-delay: 0.35s; opacity: 1; transform: translateY(0) scale(1); }
        .section-2.is-visible .s2-card-3 { transition-delay: 0.5s; opacity: 1; transform: translateY(0) scale(1); }

        /* Responsive Settings */
        @media (max-width: 1024px) {
            .tagline { margin-left: 0; margin-top: 40px; }
        }
        @media (max-width: 860px) {
            .nav-desktop { display: none; }
            .hamburger { display: flex; }
        }
        @media (max-width: 768px) {
            .s2-gallery {
                display: flex; overflow-x: auto; scroll-snap-type: x mandatory;
                scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 10px;
            }
            .s2-gallery::-webkit-scrollbar { display: none; }
            .s2-card { flex: 0 0 clamp(200px, 60vw, 300px); scroll-snap-align: start; }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="glow-overlay"></div>
        <div class="grid-lines">
            <div class="grid-line" style="left: 4.8%; animation-delay: 0s;"></div>
            <div class="grid-line" style="left: 35.45%; animation-delay: 0.1s;"></div>
            <div class="grid-line" style="left: 64.7%; animation-delay: 0.2s;"></div>
            <div class="grid-line" style="left: 95.2%; animation-delay: 0.3s;"></div>
        </div>

        <!-- HERO SECTION -->
        <section class="hero">
            <header class="header">
                <div class="logo nav-item" style="--delay: 0.1s">
                    <svg width="40" height="30" viewBox="0 0 40 30" fill="white" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 0L40 30H0L20 0Z"/>
                    </svg>
                </div>
                <div class="nav-desktop">
                    <a href="#" class="pill active nav-item" style="--delay: 0.2s">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                        HOME
                    </a>
                    <a href="#" class="pill nav-item" style="--delay: 0.28s">PROPERTIES</a>
                    <a href="#" class="pill nav-item" style="--delay: 0.36s">AGENT</a>
                    <a href="#" class="pill nav-item" style="--delay: 0.44s">PARTNER</a>
                </div>
                <div class="nav-right">
                    <div class="lang-switch nav-item" style="--delay: 0.52s">
                        <button class="lang-btn" onclick="toggleLang(this)">BA</button>
                        <button class="lang-btn active" onclick="toggleLang(this)">EN</button>
                    </div>
                    <a href="#" class="sign-in nav-item" style="--delay: 0.6s">SIGN IN</a>
                    <button class="hamburger nav-item" style="--delay: 0.65s">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
                    </button>
                </div>
            </header>

            <div class="mobile-dropdown">
                <a href="#" class="pill active" style="justify-content: flex-start;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    HOME
                </a>
                <a href="#" class="pill" style="justify-content: flex-start;">PROPERTIES</a>
                <a href="#" class="pill" style="justify-content: flex-start;">AGENT</a>
                <a href="#" class="pill" style="justify-content: flex-start;">PARTNER</a>
            </div>

            <div class="headline-row">
                <h1 class="h1-title">
                    <span class="h1-line h1-line-1"><span class="word" style="--duration:1s; --delay:0.55s">SABRINA</span></span>
                    <span class="h1-line"><span class="word" style="--duration:1s; --delay:0.75s">RESIDENCES</span></span>
                    <span class="h1-line"><span class="word" style="--duration:1s; --delay:0.95s">HOUSE</span></span>
                </h1>
                
                <div class="tagline">
                    <span class="tagline-line tagline-line-1">
                        <span class="word" style="--delay:1.15s">TRUSTED</span>
                        <span class="word" style="--delay:1.21s">REAL</span>
                        <span class="word" style="--delay:1.27s">ESTATE</span>
                    </span>
                    <span class="tagline-line">
                        <span class="word" style="--delay:1.33s">EXPERTS</span>
                        <span class="word" style="--delay:1.39s">FOR</span>
                        <span class="word" style="--delay:1.45s">A</span>
                        <span class="word" style="--delay:1.51s">SMOOTHER,</span>
                        <span class="word" style="--delay:1.57s">SMARTER</span>
                    </span>
                    <span class="tagline-line">
                        <span class="word" style="--delay:1.63s">PROPERTY</span>
                        <span class="word" style="--delay:1.69s">JOURNEY.</span>
                    </span>
                </div>
            </div>

            <div class="explore-wrapper">
                <a href="#" class="explore-link">
                    <span class="word" style="--duration:0.8s; --delay:1.85s">EXPLORE PROPERTIES</span>
                    <span class="word" style="--duration:0.8s; --delay:1.85s; display:inline-flex; align-items:center;">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7 7 17 7 17 17"/></svg>
                    </span>
                </a>
            </div>

            <div class="video-card">
                <div class="video-box">
                    <video src="https://cdn.sceneai.art/Hero%20Section%20Video/adec243d-ffda-48cf-a8a8-26e6d6bcbe9b.mp4" autoplay muted loop playsinline></video>
                </div>
                <div class="video-caption">
                    <span class="caption-line">
                        <span class="word" style="--delay:2.15s">Find</span>
                        <span class="word" style="--delay:2.21s">a</span>
                        <span class="word" style="--delay:2.27s">home</span>
                        <span class="word" style="--delay:2.33s">that</span>
                        <span class="word" style="--delay:2.39s">fits</span>
                    </span>
                    <span class="caption-line">
                        <span class="word" style="--delay:2.45s">your</span>
                        <span class="word" style="--delay:2.51s">lifestyle</span>
                    </span>
                </div>
                <div class="progress-container">
                    <div class="progress-area active"><div class="progress-bar"></div></div>
                    <div class="progress-area"><div class="progress-bar"></div></div>
                    <div class="progress-area"><div class="progress-bar"></div></div>
                    <div class="progress-area"><div class="progress-bar"></div></div>
                </div>
            </div>

            <img src="https://cdn.sceneai.art/Bg%20images/1dd58514-cedb-4f70-9aee-709c3f887808.png" class="hero-img" alt="Sabrina Residence House">
        </section>

        <!-- LATEST HOUSES SECTION -->
        <section class="section-2">
            <div class="s2-heading-col">
                <h2 class="s2-heading">
                    <span class="s2-word-wrap"><span class="s2-word" style="--delay: 0s">OUR</span></span>
                    <span class="s2-word-wrap"><span class="s2-word" style="--delay: 0.15s">LATEST</span></span>
                    <span class="s2-word-wrap"><span class="s2-word s2-word-lowercase" style="--delay: 0.3s">Houses</span></span>
                </h2>
            </div>
            <div class="s2-gallery">
                <div class="s2-card s2-card-1">
                    <img src="https://cdn.sceneai.art/Bg%20images/c789ac4d-f2c8-463a-93f6-1f8c6fa09f9a.png" alt="Latest house 1">
                </div>
                <div class="s2-card s2-card-2">
                    <img src="https://cdn.sceneai.art/Bg%20images/bf2e3004-db02-48a1-8e15-c6a58c158b5c.png" alt="Latest house 2">
                </div>
                <div class="s2-card s2-card-3">
                    <img src="https://cdn.sceneai.art/Bg%20images/dce07180-2db9-45fe-889a-7a11657c6234.png" alt="Latest house 3">
                </div>
            </div>
        </section>
    </div>

    <!-- Scripts -->
    <script>
        // Language switch
        function toggleLang(btn) {
            const parent = btn.parentElement;
            parent.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        // Hamburger menu
        const hamburger = document.querySelector('.hamburger');
        const dropdown = document.querySelector('.mobile-dropdown');
        hamburger.addEventListener('click', () => {
            dropdown.classList.toggle('open');
        });

        // Video Autoplay Guardian
        const vid = document.querySelector('.video-box video');
        const playVid = () => { if (vid && vid.paused) vid.play().catch(() => {}); };
        setInterval(playVid, 1000); // Check every 1s
        if(vid) {
            vid.addEventListener('pause', playVid);
            vid.addEventListener('ended', playVid);
            vid.addEventListener('stalled', playVid);
        }
        document.addEventListener('visibilitychange', () => { if(!document.hidden) playVid(); });
        document.addEventListener('touchstart', playVid, {once:true});
        document.addEventListener('click', playVid, {once:true});

        // Video Progress Bars
        const areas = document.querySelectorAll('.progress-area');
        if(vid && areas.length === 4) {
            vid.addEventListener('timeupdate', () => {
                if (!vid.duration) return;
                const part = vid.duration / 4;
                const currentPart = Math.min(3, Math.floor(vid.currentTime / part));
                areas.forEach((area, i) => {
                    if (i === currentPart) area.classList.add('active');
                    else area.classList.remove('active');
                });
            });
            areas.forEach((area, i) => {
                area.addEventListener('click', () => {
                    if (vid.duration) {
                        vid.currentTime = (vid.duration / 4) * i;
                        playVid();
                    }
                });
            });
        }

        // Section 2 Scroll Trigger
        const s2 = document.querySelector('.section-2');
        if(s2) {
            const observer = new IntersectionObserver(entries => {
                if(entries[0].isIntersecting) {
                    s2.classList.add('is-visible');
                    observer.unobserve(s2);
                }
            }, { threshold: 0.15 });
            observer.observe(s2);
        }
    </script>
</body>
</html>
